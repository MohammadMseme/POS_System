name: Fikra
description: "نظام إدارة معرض الأدوات المنزلية - Offline"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # قاعدة البيانات Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # إدارة الحالة والوقت
  provider: ^6.1.1
  intl: any

  # طباعة ملصقات الباركود (متوافقة مع Windows Desktop)
  pdf: ^3.11.1
  printing: ^5.13.2
  barcode: ^2.2.8

  # حزمة إصلاح وعكس الحروف العربية للطباعة
  arabic_reshaper: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # أدوات توليد كود Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

  # حزمة تخصيص أيقونات التطبيق
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # تعريف الخطوط المخصصة
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

  # مسارات الأصول الصحيحة بناءً على مجلداتك الفعلية
  assets:
    - assets/images/
    - assets/icon/
    - assets/fonts/